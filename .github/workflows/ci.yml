name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.12'
            homeassistant: '2025.1.4'
          - python: '3.14'
            homeassistant: '2026.10.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant test environment
        run: >-
          python -m pip install
          homeassistant==${{ matrix.homeassistant }}
          pytest-homeassistant-custom-component
          pyserial pyudev serialx aiousbwatcher ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: pytest
